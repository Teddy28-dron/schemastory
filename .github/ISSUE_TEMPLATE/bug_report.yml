name: Bug report
description: Report a reproducible problem in SchemaStory.
title: '[Bug]: '
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping. Use synthetic data only. Do not include secrets, private payloads, or security vulnerabilities here.
  - type: input
    id: version
    attributes:
      label: SchemaStory version
      description: Run `schemastory --version`.
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: input-format
    attributes:
      label: Input format
      options:
        - JSON
        - JSONL / NDJSON
        - Not input-related
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and `node --version` output.
      placeholder: Windows 11, Node v24.11.1
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Provide the command and the smallest synthetic before/after data that reproduces the issue.
      render: shell
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed secrets, personal data, and proprietary payloads.
          required: true
        - label: This is not a privately reportable security vulnerability.
          required: true
